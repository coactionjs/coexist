name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with .github/workflows/ci.yml so CI verifies the release toolchain.
  NPM_VERSION: 11.18.0

jobs:
  publish:
    if: github.repository == 'coactionjs/coexist'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A pending changeset means the versions in the tree are not the versions
      # meant to ship, so publishing has to stop. It used to stop by disabling
      # every later step, which left the job green: pushing a release tag with
      # a changeset still pending reported success and published nothing, and
      # the tag looked released. Fail instead — a release that did not happen
      # must not look like one that did.
      - name: Refuse to publish with pending changesets
        shell: bash
        run: |
          set -euo pipefail
          pending="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md')"
          if [ -n "$pending" ]; then
            echo "::error::Pending changesets found; run Version Packages and merge the release PR before publishing."
            echo "$pending"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install pinned npm CLI
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(node -e 'const { chromium } = require(\"playwright\"); console.log(chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Verify
        run: pnpm run ci

      - name: Publish to npm
        run: pnpm run publish:packages
        env:
          NPM_CONFIG_PROVENANCE: true
