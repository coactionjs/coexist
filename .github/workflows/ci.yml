name: CI

# Verification runs in stages so a formatting slip is reported in a couple of
# minutes instead of behind a full browser and packaging sweep. `checks` gates
# the rest; the packaging and browser stages then run in parallel.
#
# Staging changes when a failure is reported, not what is verified: every stage
# still runs on every supported Node version.
#
# Every `pnpm run` step here must also appear in the root `check` script — the
# `test:check-steps` step fails the build when the two lists drift.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Keep in sync with .github/workflows/publish.yml so CI verifies the release toolchain.
  NPM_VERSION: 11.18.0

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Verify check and CI step lists
        run: pnpm run test:check-steps

      - name: Verify smoke harness importers
        run: pnpm run test:harness-imports

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck scripts
        run: pnpm run typecheck:scripts

      - name: Unit tests and coverage thresholds
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  packaging:
    name: Packaging (Node ${{ matrix.node-version }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          npm-version: ${{ env.NPM_VERSION }}

      - name: Build
        run: pnpm run build

      - name: Verify public API report
        run: pnpm run test:api-report

      - name: Smoke package exports
        run: pnpm run test:exports

      - name: Smoke package pack
        run: pnpm run test:pack

      - name: Smoke package install
        run: pnpm run test:install

      - name: Smoke generated project runtime
        run: pnpm run test:create-runtime

      - name: Smoke installed scaffold
        run: pnpm run test:scaffold-install

      - name: Smoke pnpm dlx scaffold
        run: pnpm run test:scaffold-dlx

      - name: Smoke core decorators install
        run: pnpm run test:core:decorators-install

      - name: Smoke core container install
        run: pnpm run test:core:container-install

      - name: Smoke core app providers install
        run: pnpm run test:core:app-providers-install

      - name: Smoke core plugin providers install
        run: pnpm run test:core:plugin-providers-install

      - name: Smoke core lifecycle install
        run: pnpm run test:core:lifecycle-install

      - name: Smoke core effects install
        run: pnpm run test:core:effects-install

      - name: Smoke core async lazy install
        run: pnpm run test:core:async-lazy-install

      - name: Smoke core logger install
        run: pnpm run test:core:logger-install

      - name: Smoke core actions install
        run: pnpm run test:core:actions-install

      - name: Smoke example builds
        run: pnpm run test:examples

      - name: Smoke installed example builds
        run: pnpm run test:examples:install

      - name: Smoke installed testing example
        run: pnpm run test:examples:testing-install

      - name: Smoke example runtime
        run: pnpm run test:examples:runtime

      - name: Smoke testing helper install
        run: pnpm run test:testing:install-runtime

      - name: Smoke Svelte runtime install
        run: pnpm run test:svelte:install-runtime

      - name: Smoke framework adapters install
        run: pnpm run test:frameworks:install

      - name: Smoke framework peer-range floors
        run: pnpm run test:frameworks:min-version

      - name: Smoke framework worker adapters install
        run: pnpm run test:frameworks:worker-install

      - name: Smoke router memory install
        run: pnpm run test:router:memory-install

      - name: Smoke storage-like install
        run: pnpm run test:storage:like-install

      - name: Smoke storage service install
        run: pnpm run test:storage:service-install

      - name: Smoke storage localspace plugins install
        run: pnpm run test:storage:localspace-plugins-install

      - name: Smoke worker runtime install
        run: pnpm run test:worker:install-runtime

      - name: Smoke worker state conflict install
        run: pnpm run test:worker:state-conflict-install

      - name: Smoke data transport worker install
        run: pnpm run test:worker:data-transport-install

  browser-react:
    name: Browser React (Node ${{ matrix.node-version }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          npm-version: ${{ env.NPM_VERSION }}
          playwright: "true"

      - name: Build
        run: pnpm run build

      - name: Smoke React browser
        run: pnpm run test:frameworks:react-browser

      - name: Smoke React worker browser
        run: pnpm run test:frameworks:react-worker-browser

  browser-vue:
    name: Browser Vue (Node ${{ matrix.node-version }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          npm-version: ${{ env.NPM_VERSION }}
          playwright: "true"

      - name: Build
        run: pnpm run build

      - name: Smoke Vue browser
        run: pnpm run test:frameworks:vue-browser

      - name: Smoke Vue worker browser
        run: pnpm run test:frameworks:vue-worker-browser

  browser-svelte:
    name: Browser Svelte (Node ${{ matrix.node-version }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          npm-version: ${{ env.NPM_VERSION }}
          playwright: "true"

      - name: Build
        run: pnpm run build

      - name: Smoke Svelte browser
        run: pnpm run test:svelte:browser

      - name: Smoke Svelte worker browser
        run: pnpm run test:svelte:worker-browser

  browser-solid:
    name: Browser Solid (Node ${{ matrix.node-version }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          npm-version: ${{ env.NPM_VERSION }}
          playwright: "true"

      - name: Build
        run: pnpm run build

      - name: Smoke Solid browser
        run: pnpm run test:frameworks:solid-browser

      - name: Smoke Solid worker browser
        run: pnpm run test:frameworks:solid-worker-browser

  browser-angular:
    name: Browser Angular (Node ${{ matrix.node-version }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          npm-version: ${{ env.NPM_VERSION }}
          playwright: "true"

      - name: Build
        run: pnpm run build

      - name: Smoke Angular browser
        run: pnpm run test:frameworks:angular-browser

      - name: Smoke Angular worker browser
        run: pnpm run test:frameworks:angular-worker-browser

  browser-plugins:
    name: Browser plugins (Node ${{ matrix.node-version }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          npm-version: ${{ env.NPM_VERSION }}
          playwright: "true"

      - name: Build
        run: pnpm run build

      - name: Smoke router browser
        run: pnpm run test:router-browser

      - name: Smoke storage browser
        run: pnpm run test:storage-browser

      - name: Smoke storage IndexedDB browser
        run: pnpm run test:storage:indexeddb-browser

      - name: Smoke devtools browser
        run: pnpm run test:devtools-browser

      - name: Smoke plugin stack browser
        run: pnpm run test:plugins:browser

  browser-worker:
    name: Browser worker (Node ${{ matrix.node-version }})
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
          npm-version: ${{ env.NPM_VERSION }}
          playwright: "true"

      - name: Build
        run: pnpm run build

      - name: Smoke worker async browser
        run: pnpm run test:worker:async-browser

      - name: Smoke broadcast worker browser
        run: pnpm run test:worker:broadcast-browser

  release-checks:
    name: Release checks
    # The publish dry run verifies the release plan against the registry, which
    # only means something for what is about to be released. Running it on every
    # pull request spends a full install and build to re-check the same plan.
    if: github.event_name == 'push'
    needs: packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: 24.x
          npm-version: ${{ env.NPM_VERSION }}

      - name: Build
        run: pnpm run build

      - name: Smoke publish dry run
        run: pnpm run test:publish-dry-run

  # One status check for branch protection to require. Job names carry their
  # Node version and their suite, so every split, rename, or added framework
  # would otherwise mean editing the protected-branch configuration — and a
  # required check that no longer reports blocks every pull request forever.
  # This job's name is the contract; the jobs behind it are free to change.
  ci:
    name: CI
    if: always()
    needs:
      - checks
      - packaging
      - browser-react
      - browser-vue
      - browser-svelte
      - browser-solid
      - browser-angular
      - browser-plugins
      - browser-worker
      - release-checks
    runs-on: ubuntu-latest

    steps:
      - name: Verify every job succeeded
        shell: bash
        env:
          # `always()` also runs this job when a dependency was skipped, which
          # is the normal case for release checks on a pull request.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::A required CI job reported '${result}'."
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
