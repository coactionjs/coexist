name: Setup workspace
description: Install pnpm, Node, the pinned npm CLI, and workspace dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: true
  npm-version:
    description: npm CLI version to install globally.
    required: true
  playwright:
    description: Install the Chromium build the browser smokes drive.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11.8.0

    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}

    - name: Install pinned npm CLI
      shell: bash
      run: npm install -g npm@${{ inputs.npm-version }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browser
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        pnpm exec playwright install --with-deps chromium
        echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(node -e 'const { chromium } = require(\"playwright\"); console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
